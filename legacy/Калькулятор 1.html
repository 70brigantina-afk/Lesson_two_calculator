<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Семейный бюджет PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  color:#111;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:42px;
  margin:10px 0 30px;
}

h2{
  margin-top:0;
  font-size:24px;
}

.card{
  background:#fff;
  padding:24px;
  margin-bottom:22px;
  border-radius:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.row{
  display:flex;
  gap:12px;
  margin-bottom:14px;
}

input,select,button{
  height:48px;
  font-size:16px;
  padding:0 14px;
  border:1px solid #ccc;
  border-radius:10px;
}

input,select{
  width:100%;
  background:#fff;
}

button{
  cursor:pointer;
  background:#eee;
  white-space:nowrap;
}

button:hover{background:#ddd}

.btn-primary{
  background:#111;
  color:#fff;
  border:none;
}

.btn-primary:hover{background:#333}

.btn-danger{
  background:#fff0f0;
  color:#b00020;
  border:1px solid #f0b5b5;
}

.btn-edit{
  background:#eef4ff;
  color:#174ea6;
  border:1px solid #bdd4ff;
}

.summary{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.summary-box{
  background:#f7f7f7;
  padding:18px;
  border-radius:14px;
  font-size:16px;
}

.summary-box b{
  display:block;
  margin-top:8px;
  font-size:22px;
}

.plus{color:#168038;font-weight:bold}
.minus{color:#c62828;font-weight:bold}
.blue{color:#174ea6;font-weight:bold}
.gold{color:#9a6b00;font-weight:bold}

.category-list,.account-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.category-item,.account-item{
  background:#f7f7f7;
  padding:15px;
  border-radius:12px;
}

.progress-bg{
  height:12px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progress{
  height:100%;
  background:#111;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px;
  text-align:left;
  font-size:14px;
}

th{
  background:#f1f1f1;
  cursor:pointer;
}

.advice{
  background:#fff8dc;
  padding:16px;
  border-radius:12px;
  font-size:17px;
  line-height:1.5;
}

.mobile-list{display:none}

.operation-card{
  background:#f7f7f7;
  padding:14px;
  border-radius:12px;
  margin-bottom:10px;
}

.small-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

@media(max-width:850px){
  h1{font-size:30px}
  .row{flex-direction:column}
  .summary{grid-template-columns:1fr}
  .category-list,.account-list{grid-template-columns:1fr}
  table{display:none}
  .mobile-list{display:block}
}
</style>
</head>

<body>

<div class="container">

<h1>Семейный бюджет PRO</h1>

<div class="card">
  <h2>Настройки месяца</h2>
  <div class="row">
    <input type="month" id="monthFilter">
    <input type="number" id="startBalance" placeholder="Остаток на начало месяца">
    <button onclick="saveStartBalance()">Сохранить</button>
  </div>
</div>

<div class="card">
  <h2 id="formTitle">Добавить операцию</h2>

  <div class="row">
    <input type="date" id="date">
    <select id="type">
      <option value="income">Доход</option>
      <option value="expense">Расход</option>
      <option value="debt">Долг / кредит</option>
      <option value="saving">Накопления</option>
    </select>
  </div>

  <div class="row">
    <input type="text" id="category" placeholder="Категория: зарплата, продукты, кредит">
    <input type="number" id="amount" placeholder="Сумма">
  </div>

  <div class="row">
    <select id="account">
      <option value="Наличные">Наличные</option>
      <option value="Сбербанк">Сбербанк</option>
      <option value="Т-Банк">Т-Банк</option>
      <option value="ВТБ">ВТБ</option>
      <option value="Другое">Другое</option>
    </select>
    <input type="text" id="comment" placeholder="Комментарий">
    <button class="btn-primary" onclick="saveOperation()">Сохранить</button>
    <button onclick="resetForm()">Сброс</button>
  </div>
</div>

<div class="card">
  <h2>Статистика</h2>
  <div class="summary">
    <div class="summary-box">Остаток на начало<b id="startBalanceView">0 ₽</b></div>
    <div class="summary-box">Доход<b id="totalIncome" class="plus">0 ₽</b></div>
    <div class="summary-box">Расход<b id="totalExpense" class="minus">0 ₽</b></div>
    <div class="summary-box">Долги / кредиты<b id="totalDebt" class="gold">0 ₽</b></div>
    <div class="summary-box">Баланс<b id="balance">0 ₽</b></div>
  </div>
</div>

<div class="card">
  <h2>Счета</h2>
  <div id="accountStats" class="account-list"></div>
</div>

<div class="card">
  <h2>Расходы по категориям</h2>
  <div id="categoryStats" class="category-list"></div>
</div>

<div class="card">
  <h2>Финансовая подсказка</h2>
  <div id="advice" class="advice">Добавьте операции — и я покажу итог.</div>
</div>

<div class="card">
  <h2>История операций</h2>

  <div class="row">
    <input type="text" id="search" placeholder="Поиск по категории, счёту, комментарию или сумме" oninput="render()">
    <select id="typeFilter" onchange="render()">
      <option value="all">Все операции</option>
      <option value="income">Доходы</option>
      <option value="expense">Расходы</option>
      <option value="debt">Долги / кредиты</option>
      <option value="saving">Накопления</option>
    </select>
    <select id="sortBy" onchange="render()">
      <option value="date">Сортировка: дата</option>
      <option value="amount">Сортировка: сумма</option>
      <option value="category">Сортировка: категория</option>
    </select>
  </div>

  <div class="row small-buttons">
    <button onclick="exportCSV()">Экспорт CSV / Excel</button>
    <button onclick="exportJSON()">Резервная копия JSON</button>
    <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
    <button class="btn-danger" onclick="clearAll()">Очистить всё</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Дата</th>
        <th>Тип</th>
        <th>Категория</th>
        <th>Сумма</th>
        <th>Счёт</th>
        <th>Комментарий</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody id="operationList"></tbody>
  </table>

  <div id="mobileList" class="mobile-list"></div>
</div>

</div>

<script>
let operations = JSON.parse(localStorage.getItem("familyBudgetOperationsPro")) || [];
let balances = JSON.parse(localStorage.getItem("familyBudgetBalancesPro")) || {};
let editId = null;

const today = new Date();
const currentMonth = today.toISOString().slice(0,7);

document.getElementById("monthFilter").value = currentMonth;
document.getElementById("date").value = today.toISOString().slice(0,10);

function escapeHTML(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatRub(value){
  return Number(value).toLocaleString("ru-RU") + " ₽";
}

function formatDate(date){
  return new Date(date).toLocaleDateString("ru-RU");
}

function getTypeName(type){
  const names = {
    income:"Доход",
    expense:"Расход",
    debt:"Долг / кредит",
    saving:"Накопления"
  };
  return names[type] || type;
}

function saveData(){
  localStorage.setItem("familyBudgetOperationsPro", JSON.stringify(operations));
  localStorage.setItem("familyBudgetBalancesPro", JSON.stringify(balances));
}

function getSelectedMonth(){
  return document.getElementById("monthFilter").value;
}

function saveStartBalance(){
  const month = getSelectedMonth();
  balances[month] = Number(document.getElementById("startBalance").value) || 0;
  saveData();
  render();
}

function saveOperation(){
  const date = document.getElementById("date").value;
  const type = document.getElementById("type").value;
  const category = document.getElementById("category").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const account = document.getElementById("account").value;
  const comment = document.getElementById("comment").value.trim();

  if(!date){alert("Укажите дату");return}
  if(!category){alert("Укажите категорию");return}
  if(!amount || amount <= 0){alert("Укажите корректную сумму");return}

  const item = {id: editId || Date.now(), date, type, category, amount, account, comment};

  if(editId){
    operations = operations.map(op => op.id === editId ? item : op);
  }else{
    operations.push(item);
  }

  saveData();
  resetForm();
  render();
}

function editOperation(id){
  const item = operations.find(op => op.id === id);
  if(!item) return;

  editId = id;
  document.getElementById("formTitle").textContent = "Редактировать операцию";
  document.getElementById("date").value = item.date;
  document.getElementById("type").value = item.type;
  document.getElementById("category").value = item.category;
  document.getElementById("amount").value = item.amount;
  document.getElementById("account").value = item.account;
  document.getElementById("comment").value = item.comment;
  window.scrollTo({top:0, behavior:"smooth"});
}

function resetForm(){
  editId = null;
  document.getElementById("formTitle").textContent = "Добавить операцию";
  document.getElementById("date").value = today.toISOString().slice(0,10);
  document.getElementById("type").value = "income";
  document.getElementById("category").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("account").value = "Наличные";
  document.getElementById("comment").value = "";
}

function deleteOperation(id){
  if(confirm("Удалить эту операцию?")){
    operations = operations.filter(item => item.id !== id);
    saveData();
    render();
  }
}

function clearAll(){
  if(confirm("Удалить все операции? Это действие нельзя отменить.")){
    operations = [];
    saveData();
    render();
  }
}

function getFilteredOperations(){
  const month = getSelectedMonth();
  const typeFilter = document.getElementById("typeFilter").value;
  const search = document.getElementById("search").value.toLowerCase().trim();
  const sortBy = document.getElementById("sortBy").value;

  let list = operations.filter(item => item.date.slice(0,7) === month);

  if(typeFilter !== "all"){
    list = list.filter(item => item.type === typeFilter);
  }

  if(search){
    list = list.filter(item =>
      item.category.toLowerCase().includes(search) ||
      item.account.toLowerCase().includes(search) ||
      String(item.amount).includes(search) ||
      item.comment.toLowerCase().includes(search)
    );
  }

  list.sort((a,b)=>{
    if(sortBy === "amount") return b.amount - a.amount;
    if(sortBy === "category") return a.category.localeCompare(b.category);
    return new Date(a.date) - new Date(b.date);
  });

  return list;
}

function render(){
  const month = getSelectedMonth();
  const startBalance = balances[month] || 0;
  const list = getFilteredOperations();

  document.getElementById("startBalance").value = startBalance || "";
  document.getElementById("startBalanceView").textContent = formatRub(startBalance);

  let income = 0;
  let expense = 0;
  let debt = 0;
  let saving = 0;
  let categoryExpenses = {};
  let accountStats = {};

  const table = document.getElementById("operationList");
  const mobile = document.getElementById("mobileList");

  table.innerHTML = "";
  mobile.innerHTML = "";

  list.forEach(item=>{
    if(item.type === "income") income += item.amount;
    if(item.type === "expense") expense += item.amount;
    if(item.type === "debt") debt += item.amount;
    if(item.type === "saving") saving += item.amount;

    if(item.type === "expense"){
      categoryExpenses[item.category] = (categoryExpenses[item.category] || 0) + item.amount;
    }

    if(!accountStats[item.account]){
      accountStats[item.account] = {income:0, expense:0, debt:0, saving:0};
    }
    accountStats[item.account][item.type] += item.amount;

    const amountClass = item.type === "income" ? "plus" : item.type === "saving" ? "blue" : item.type === "debt" ? "gold" : "minus";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${formatDate(item.date)}</td>
      <td>${getTypeName(item.type)}</td>
      <td>${escapeHTML(item.category)}</td>
      <td class="${amountClass}">${formatRub(item.amount)}</td>
      <td>${escapeHTML(item.account)}</td>
      <td>${escapeHTML(item.comment) || "—"}</td>
      <td>
        <button class="btn-edit" onclick="editOperation(${item.id})">Изменить</button>
        <button class="btn-danger" onclick="deleteOperation(${item.id})">Удалить</button>
      </td>
    `;
    table.appendChild(tr);

    const card = document.createElement("div");
    card.className = "operation-card";
    card.innerHTML = `
      <strong class="${amountClass}">${formatRub(item.amount)}</strong>
      ${formatDate(item.date)} · ${getTypeName(item.type)}<br>
      Категория: ${escapeHTML(item.category)}<br>
      Счёт: ${escapeHTML(item.account)}<br>
      ${item.comment ? "Комментарий: " + escapeHTML(item.comment) + "<br>" : ""}
      <button class="btn-edit" onclick="editOperation(${item.id})">Изменить</button>
      <button class="btn-danger" onclick="deleteOperation(${item.id})">Удалить</button>
    `;
    mobile.appendChild(card);
  });

  const balance = startBalance + income - expense - debt - saving;

  document.getElementById("totalIncome").textContent = formatRub(income);
  document.getElementById("totalExpense").textContent = formatRub(expense);
  document.getElementById("totalDebt").textContent = formatRub(debt);

  const balanceEl = document.getElementById("balance");
  balanceEl.textContent = formatRub(balance);
  balanceEl.className = balance >= 0 ? "plus" : "minus";

  renderCategoryStats(categoryExpenses, expense);
  renderAccountStats(accountStats);
  renderAdvice(income, expense, debt, saving, balance);
}

function renderCategoryStats(categoryExpenses,totalExpense){
  const block = document.getElementById("categoryStats");
  block.innerHTML = "";

  const entries = Object.entries(categoryExpenses).sort((a,b)=>b[1]-a[1]);

  if(entries.length === 0){
    block.innerHTML = "Расходов пока нет.";
    return;
  }

  entries.forEach(([category,amount])=>{
    const percent = totalExpense > 0 ? Math.round((amount / totalExpense) * 100) : 0;
    const div = document.createElement("div");
    div.className = "category-item";
    div.innerHTML = `
      <b>${escapeHTML(category)}</b><br>
      ${formatRub(amount)} · ${percent}%
      <div class="progress-bg">
        <div class="progress" style="width:${percent}%"></div>
      </div>
    `;
    block.appendChild(div);
  });
}

function renderAccountStats(accountStats){
  const block = document.getElementById("accountStats");
  block.innerHTML = "";

  const entries = Object.entries(accountStats);

  if(entries.length === 0){
    block.innerHTML = "Операций по счетам пока нет.";
    return;
  }

  entries.forEach(([account,data])=>{
    const result = data.income - data.expense - data.debt - data.saving;
    const div = document.createElement("div");
    div.className = "account-item";
    div.innerHTML = `
      <b>${escapeHTML(account)}</b><br>
      Доход: <span class="plus">${formatRub(data.income)}</span><br>
      Расход: <span class="minus">${formatRub(data.expense)}</span><br>
      Долги: <span class="gold">${formatRub(data.debt)}</span><br>
      Накопления: <span class="blue">${formatRub(data.saving)}</span><br>
      Итог: <b class="${result >= 0 ? "plus" : "minus"}">${formatRub(result)}</b>
    `;
    block.appendChild(div);
  });
}

function renderAdvice(income,expense,debt,saving,balance){
  const advice = document.getElementById("advice");

  if(income === 0 && expense === 0 && debt === 0 && saving === 0){
    advice.innerHTML = "Добавьте доходы и расходы — и здесь появится финансовая подсказка.";
    return;
  }

  const totalOut = expense + debt + saving;
  const dailyLimit = balance > 0 ? Math.floor(balance / 30) : 0;

  if(balance > 0 && totalOut <= income * 0.7){
    advice.innerHTML = `
      Отлично. Бюджет устойчивый. Остаток: <b class="plus">${formatRub(balance)}</b>.<br>
      Примерный лимит на день: <b>${formatRub(dailyLimit)}</b>.
    `;
  }else if(balance > 0){
    advice.innerHTML = `
      Бюджет в плюсе, но расходы высокие. Остаток: <b class="plus">${formatRub(balance)}</b>.<br>
      Проверьте самые крупные категории — там часто сидят денежные «пылесосы».
    `;
  }else{
    advice.innerHTML = `
      Бюджет в минусе: <b class="minus">${formatRub(Math.abs(balance))}</b>.<br>
      Нужно сократить расходы или добавить доход. Деньги не должны убегать быстрее, чем вы их догоняете.
    `;
  }
}

function exportCSV(){
  let csv = "Дата;Тип;Категория;Сумма;Счет;Комментарий\n";

  operations.forEach(item=>{
    csv += `${item.date};${getTypeName(item.type)};${item.category};${item.amount};${item.account};${item.comment}\n`;
  });

  downloadFile(csv, "family-budget.csv", "text/csv;charset=utf-8");
}

function exportJSON(){
  const data = JSON.stringify({operations,balances}, null, 2);
  downloadFile(data, "family-budget-backup.json", "application/json");
}

function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);

      if(!Array.isArray(data.operations) || typeof data.balances !== "object"){
        alert("Файл не подходит для импорта");
        return;
      }

      operations = data.operations;
      balances = data.balances;
      saveData();
      render();
      alert("Данные успешно импортированы");
    }catch(error){
      alert("Ошибка чтения файла");
    }
  };

  reader.readAsText(file);
}

function downloadFile(content,filename,type){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("monthFilter").addEventListener("change",render);

render();
</script>

</body>
</html>
